# Runs the published image next to PostgreSQL.
# Usage: IMAGE=ghcr.io/<owner>/oss-portal:latest JWT_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=... docker compose up -d
services:
  app:
    image: ${IMAGE:?set IMAGE to the published image}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oss
      DB_USER: oss
      DB_PASSWORD: ${DB_PASSWORD:-oss}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of at least 32 bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - oss-files:/data/storage

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oss
      POSTGRES_USER: oss
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oss}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss -d oss"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - oss-pgdata:/var/lib/postgresql/data

volumes:
  oss-files:
  oss-pgdata:
