spring:
  application:
    name: oss-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/oss}
    username: ${DB_USER:oss}
    password: ${DB_PASSWORD:oss}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true
