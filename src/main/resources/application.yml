spring:
  application:
    name: oss-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/oss}
    username: ${DB_USER:oss}
    password: ${DB_PASSWORD:oss}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true

oss:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    token-ttl: 8h
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
